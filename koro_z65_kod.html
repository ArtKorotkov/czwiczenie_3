<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <div id="pierwszy_korotkov">
        <p>Pierwszy akapit/pierwszy DIV--> Koroktov <br>
            nazwa ID akapitu id="pierwszy_korotkov"</p>
        <p>Drugi akapit/pierwszy DIV <br>
            pierwszy akapit --> p:first-child{font-size:9mm;font-styl:italic;} <br>
            bo numer parzysty w dzienniku <br>
            pozostałe akapity --> p{font-size:10pt;} bo numer parzysty <br>
            szerokość bloku = 700+10*4=740pt <br>
            pierwszy DIV--> kolor jasno zielony</p>
        <p>trzeci akapit/pierwszy DIV <br>
            pierwszy DIV--> obramowanie czarny DIV <br>
            pierwszy DIV--> obramowanie grubość 3px, ciągłe (solid) <br>
            pierwszy DIV--> r1=7mm+5(Artem)=12mm </p>
    </div>
    <div id="drugi_korotkov">
        <p>Pierwszy akapit/drugi DIV--> Artem <br>
            nazwa ID akapitu id="drugi_korotkov"</p>
        <p>Drugi akapit/drugi DIV <br>
            drugi DIV--> kolor jasno niebieski</p>
        <p>trzeci akapit/drugi DIV <br>
            drugi DIV--> obramowanie  granatowy DIV <br>
            drugi DIV--> obramowanie grubość 5px, ciągłe (solid) <br>
            drugi DIV--> r2=7mm+8(Koroktov)=15mm</p>
    </div>
    <div id="trzeci_korotkov">
        <p>Pierwszy akapit/trzeci DIV--> klasa 1P nazwa ID akapitu id="trzeci_korotkov"</p>
        <p>Drugi akapit/trzeci DIVbr <br>
            pierwszy DIV--> kolor różowy</p>
        <p>trzeci akapit/trzeci DIV(solid) <br>
            trzeci DIV--> obramowanie fioletowy DIV <br>
            trzeci DIV--> obramowanie grubość 7px, ciągłe (solid) <br>
            trzeci DIV--> r3=7mm+11(listopad)=18mm</p>
    </div>
</body>
</html>
